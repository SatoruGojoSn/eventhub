name: CI/CD EventHub

# ---------------------------------------------------------------------------
# Strategie de branches
#   main      -> production  : tests + build + push des images + deploiement
#   develop   -> integration : tests + build + push des images (tag "develop")
#   feature/* -> validation  : tests uniquement (via Pull Request)
# ---------------------------------------------------------------------------
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  NODE_VERSION: '22'

# Annule les executions precedentes encore en cours sur la meme branche.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # 1. TESTS UNITAIRES - un job par microservice, executes en parallele
  # ===========================================================================
  test-backend:
    name: Tests ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - events-service
          - participants-service
          - registrations-service

    steps:
      - name: Checkout du code
        uses: actions/checkout@v7

      - name: Installation de Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Installation des dependances
        working-directory: ${{ matrix.service }}
        run: npm ci

      - name: Execution des tests unitaires
        working-directory: ${{ matrix.service }}
        run: npm test

  # ===========================================================================
  # 2. BUILD DU FRONTEND
  # ===========================================================================
  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v7

      - name: Installation de Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installation des dependances
        working-directory: frontend
        run: npm ci

      - name: Build de production (Vite)
        working-directory: frontend
        run: npm run build

      - name: Publication du bundle en artefact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ===========================================================================
  # 3. BUILD + PUSH DES IMAGES DOCKER (uniquement sur main et develop)
  # ===========================================================================
  docker:
    name: Image ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend]
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - events-service
          - participants-service
          - registrations-service
          - frontend

    steps:
      - name: Checkout du code
        uses: actions/checkout@v7

      - name: Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Authentification sur GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcul des tags et labels de l'image
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build et publication de l'image
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache partage entre executions : accelere fortement les builds
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ===========================================================================
  # 4. DEPLOIEMENT AUTOMATIQUE (branche main uniquement)
  # ===========================================================================
  deploy:
    name: Deploiement production
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main'
    environment:
      name: production

    steps:
      - name: Checkout du code
        uses: actions/checkout@v7

      - name: Verification des secrets de deploiement
        id: check
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -n "$DEPLOY_HOST" ] && [ -n "$DEPLOY_USER" ] && [ -n "$DEPLOY_SSH_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploiement sur le serveur via SSH
        if: steps.check.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH || '~/eventhub' }}
            git pull origin main
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export REGISTRY=ghcr.io/${{ github.repository }}
            export TAG=latest
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f

      - name: Verification de sante apres deploiement
        if: steps.check.outputs.ready == 'true'
        run: |
          BASE="${{ secrets.DEPLOY_URL }}"
          if [ -z "$BASE" ]; then
            echo "DEPLOY_URL non defini : verification ignoree."
            exit 0
          fi
          for i in $(seq 1 10); do
            if curl -fsS "$BASE/health" > /dev/null; then
              echo "Application en ligne sur $BASE"
              exit 0
            fi
            echo "Tentative $i/10..."
            sleep 10
          done
          echo "L application ne repond pas apres le deploiement."
          exit 1

      - name: Deploiement ignore (secrets absents)
        if: steps.check.outputs.ready != 'true'
        run: |
          echo "::notice title=Deploiement ignore::Les images Docker ont ete publiees sur ghcr.io."
          echo "Pour activer le deploiement automatique, definir dans les secrets du depot :"
          echo "  DEPLOY_HOST     adresse du serveur cible"
          echo "  DEPLOY_USER     utilisateur SSH"
          echo "  DEPLOY_SSH_KEY  cle privee SSH"
          echo "  DEPLOY_PATH     (optionnel) chemin du projet sur le serveur"
          echo "  DEPLOY_URL      (optionnel) URL publique pour le test de sante"
