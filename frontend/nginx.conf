server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Resolution DNS interne de Docker : les noms de services sont resolus au
    # demarrage des conteneurs.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ---------------------------------------------------------------------
    # Passerelle API : un prefixe /api/<ressource> par microservice.
    # Nginx supprime le prefixe /api avant de transferer la requete.
    # ---------------------------------------------------------------------
    location /api/events/ {
        proxy_pass http://events-service:3001/events/;
        include /etc/nginx/proxy_headers.conf;
    }

    location = /api/events {
        proxy_pass http://events-service:3001/events;
        include /etc/nginx/proxy_headers.conf;
    }

    location /api/participants/ {
        proxy_pass http://participants-service:3002/participants/;
        include /etc/nginx/proxy_headers.conf;
    }

    location = /api/participants {
        proxy_pass http://participants-service:3002/participants;
        include /etc/nginx/proxy_headers.conf;
    }

    location /api/registrations/ {
        proxy_pass http://registrations-service:3003/registrations/;
        include /etc/nginx/proxy_headers.conf;
    }

    location = /api/registrations {
        proxy_pass http://registrations-service:3003/registrations;
        include /etc/nginx/proxy_headers.conf;
    }

    # Sondes de sante agregees pour le tableau de bord
    location = /api/health/events {
        proxy_pass http://events-service:3001/health;
        include /etc/nginx/proxy_headers.conf;
    }

    location = /api/health/participants {
        proxy_pass http://participants-service:3002/health;
        include /etc/nginx/proxy_headers.conf;
    }

    location = /api/health/registrations {
        proxy_pass http://registrations-service:3003/health;
        include /etc/nginx/proxy_headers.conf;
    }

    # Sonde du conteneur frontend lui-meme
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"UP","service":"frontend"}';
    }

    # Cache long pour les assets versionnes generes par Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA : toute autre URL renvoie index.html (routage cote client)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
